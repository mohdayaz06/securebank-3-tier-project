apiVersion: apps/v1
kind: Deployment
metadata:
  name: securebank-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: securebank-frontend
  template:
    metadata:
      labels:
        app: securebank-frontend
    spec:
      containers:
        - name: frontend
          image: mohdayazz/securebank-frontend:v3
          ports:
            - containerPort: 8080
